<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/logo.png">
  <title>TOEIC Preparation · English Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0B1F3A; --teal:#5bb8b0; --teal-dark:#238d85; --gold:#d4a843; --ink:#172033; --muted:#6b7fa3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(91,184,176,0.16), transparent 34rem),
        linear-gradient(180deg, #f7fafc 0%, #eef4f7 100%);
    }
    .card {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 28px 26px;
      box-shadow: 0 1px 2px rgba(30,45,90,0.04), 0 12px 32px rgba(30,45,90,0.06);
      border: 1px solid rgba(30,45,90,0.06);
      text-align: center;
    }
    .mark {
      width: 72px; height: 72px; border-radius: 999px; margin: 0 auto 16px;
      background: #fff; padding: 4px;
      box-shadow: 0 0 0 1px rgba(30,45,90,0.08);
    }
    .mark img { width: 100%; height: 100%; border-radius: 999px; object-fit: cover; display: block; }
    .eyebrow { color: var(--teal-dark); font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin-top: 8px; font-size: 1.55rem; color: var(--navy); letter-spacing: -0.03em; }
    p { margin-top: 10px; color: var(--muted); line-height: 1.55; }
    .soon {
      display: inline-block; margin-top: 18px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(91,184,176,0.16); color: var(--teal-dark);
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    }
    a.home {
      display: inline-flex; margin-top: 22px;
      padding: 10px 16px; border-radius: 999px;
      background: var(--navy); color: #fff !important; text-decoration: none !important;
      font-weight: 800; font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"><img src="../assets/logo.png" alt=""></div>
    <div class="eyebrow">Exam track</div>
    <h1>TOEIC Preparation</h1>
    <p>This track will open here when the TOEIC platform is ready. Your hub PIN already works for this level.</p>
    <span class="soon">Coming soon</span>
    <div><a class="home" href="../">Back to English Hub</a></div>
  </main>
</body>
</html>
