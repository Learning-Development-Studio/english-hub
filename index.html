<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe9f2">
  <meta name="description" content="English Hub — Learning & Development Studio. Elige tu nivel.">
  <title>English Hub · L&amp;D Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B1F3A;
      --teal: #2a9d94;
      --gold: #d4a843;
      --ink: #1c2438;
      --muted: #6b7a94;
      --line: rgba(30, 45, 90, 0.10);
      --paper: #ffffff;
      --panel: #f3f5f8;
      --danger: #b42318;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      background:
        radial-gradient(900px 520px at 12% 18%, rgba(91, 184, 176, 0.35), transparent 55%),
        radial-gradient(800px 480px at 88% 12%, rgba(212, 168, 67, 0.28), transparent 50%),
        radial-gradient(700px 500px at 70% 88%, rgba(58, 110, 165, 0.22), transparent 55%),
        linear-gradient(160deg, #e8eef6 0%, #e4f3f1 45%, #f7f1e4 100%);
    }
    .card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      background: var(--paper);
      border-radius: 28px;
      box-shadow: 0 2px 4px rgba(11, 31, 58, 0.04), 0 24px 60px rgba(11, 31, 58, 0.12);
      overflow: hidden;
      min-height: min(560px, calc(100dvh - 48px));
    }
    @media (min-width: 820px) {
      .card { grid-template-columns: 0.9fr 1.1fr; min-height: 560px; }
    }
    .brand {
      background: var(--panel);
      display: grid;
      place-items: center;
      padding: 36px 28px;
      border-bottom: 1px solid var(--line);
    }
    @media (min-width: 820px) {
      .brand { border-bottom: 0; border-right: 1px solid var(--line); }
    }
    .logo {
      width: min(280px, 72vw);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(11, 31, 58, 0.10));
    }
    .panel {
      padding: clamp(24px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal);
    }
    h1 {
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--navy);
      line-height: 1.1;
    }
    .lead {
      font-size: 15px;
      color: var(--muted);
      max-width: 36ch;
      line-height: 1.45;
    }
    form { display: grid; gap: 14px; margin-top: 4px; }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }
    input, select {
      width: 100%;
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 13px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      border-color: rgba(42, 157, 148, 0.55);
      box-shadow: 0 0 0 4px rgba(42, 157, 148, 0.15);
    }
    .pin-wrap { position: relative; }
    .pin-wrap input { letter-spacing: 0.2em; font-weight: 700; }
    .hint { font-size: 12px; font-weight: 500; color: var(--muted); }
    .error {
      display: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--danger);
      background: rgba(180, 35, 24, 0.06);
      border: 1px solid rgba(180, 35, 24, 0.15);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .error.show { display: block; }
    button[type="submit"] {
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      padding: 14px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button[type="submit"]:hover { background: #132a4a; }
    button[type="submit"] .arrow { color: var(--gold); font-size: 18px; }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--gold);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Entrada al English Hub">
    <aside class="brand">
      <img class="logo" src="./assets/logo.png" width="280" height="280" alt="Learning &amp; Development Studio">
    </aside>
    <section class="panel">
      <div class="kicker">Espacio de alumnos</div>
      <h1>Escribe tu nombre y elige tu nivel.</h1>
      <p class="lead">Entras solo al material de tu nivel. El PIN es por nivel (ciclo 26).</p>
      <form id="entry-form" novalidate>
        <label>Tu nombre
          <input id="student-name" name="name" type="text" autocomplete="nickname" placeholder="Ej. Sofía" required maxlength="40">
        </label>
        <label>Nivel
          <select id="level" name="level" required>
            <option value="" disabled selected>Selecciona tu nivel</option>
            <option value="PreA1">PreA1</option>
            <option value="A1.1">A1.1</option>
            <option value="A1.2">A1.2</option>
            <option value="A2.1">A2.1</option>
            <option value="A2.2">A2.2</option>
            <option value="B1.1">B1.1</option>
            <option value="B1.2">B1.2</option>
            <option value="B1+">B1+</option>
          </select>
        </label>
        <label>PIN del nivel
          <span class="pin-wrap">
            <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="••••" required maxlength="8" autocomplete="off">
          </span>
          <span class="hint">Te lo da tu teacher. Es temporal (aún no es seguridad real).</span>
        </label>
        <div id="error" class="error" role="alert"></div>
        <button type="submit">Entrar <span class="arrow" aria-hidden="true">→</span></button>
      </form>
      <div class="foot"><span>English Hub</span><span>2026–2027</span></div>
    </section>
  </main>
  <script>
    (function () {
      const PINS = {"PreA1":"2600","A1.1":"2611","A1.2":"2612","A2.1":"2621","A2.2":"2622","B1.1":"2631","B1.2":"2632","B1+":"2639"};
      const form = document.getElementById("entry-form");
      const nameInput = document.getElementById("student-name");
      const levelSelect = document.getElementById("level");
      const pinInput = document.getElementById("pin");
      const errorEl = document.getElementById("error");
      try {
        const saved = JSON.parse(localStorage.getItem("ld-english-hub") || "null");
        if (saved && saved.name) nameInput.value = saved.name;
        if (saved && saved.level && PINS[saved.level]) levelSelect.value = saved.level;
      } catch (_) {}
      function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }
      function clearError() { errorEl.textContent = ""; errorEl.classList.remove("show"); }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearError();
        const name = (nameInput.value || "").trim();
        const level = levelSelect.value;
        const pin = (pinInput.value || "").trim();
        if (!name) { showError("Escribe tu nombre."); nameInput.focus(); return; }
        if (!level || !PINS[level]) { showError("Elige tu nivel."); levelSelect.focus(); return; }
        if (pin !== PINS[level]) { showError("PIN incorrecto para ese nivel. Pídeselo a tu teacher."); pinInput.focus(); pinInput.select(); return; }
        try { localStorage.setItem("ld-english-hub", JSON.stringify({ name: name, level: level, at: Date.now() })); } catch (_) {}
        const folder = encodeURIComponent(level);
        window.location.href = "./" + folder + "/";
      });
    })();
  </script>
</body>
</html>
